[project]
name = "cdc2026"
version = "0.0.0"
description = "JAX port of CDC2026 DADS experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jax[cuda13]>=0.4.30",
  "flax>=0.8.5",
  "optax>=0.2.3",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
cdc-train = "cdc2026.train:main"
cdc-debug-one-step = "cdc2026.debug_one_step:main"
cdc-plot-trajectories = "cdc2026.plot_trajectories:main"
cdc-hlo-analysis = "cdc2026.hlo_analysis:main"
cdc-profile = "cdc2026.profiler:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
